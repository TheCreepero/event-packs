l_german:
 ep_pol.1.t:0 "Cable Car Opens on Kasprowy Wierch"
 ep_pol.1.desc:0 "On 15 March the cable car from Kuźnice to Kasprowy Wierch opened in the Tatra mountains. Work began on 1 August 1935 and lasted over seven months. The line is nearly 4300 metres long.\n\nIt is the first investment of its kind in Poland and the 60th in the world. It was built on the initiative of the president of the Polish Ski Association."
 ep_pol.1.a:0 "Keep the fares low enough for ordinary skiers."
 ep_pol.1.b:0 "Our ski patrols will use it too."
 ep_pol.2.t:0 "MS Batory Begins Her Maiden Voyage"
 ep_pol.2.desc:0 "The liner Batory began her maiden voyage on 18 May. That day she left the Gdynia maritime station with 600 passengers aboard.\n\nShe belongs to the Gdynia-America Line and is the sister ship of MS Piłsudski. She was launched on 3 July 1935 and measures 14,287 GRT. This month she begins regular service on the Gdynia to New York run."
 ep_pol.2.a:0 "Let her sail as the nation's showpiece."
 ep_pol.2.b:0 "She must pay her way on the Atlantic."
 ep_pol.3.t:0 "Poland Brings Six Medals Home from the Olympics"
 ep_pol.3.desc:0 "The Olympic Games ran from 1 to 16 August. Poland sent 144 competitors, 127 men and 17 women, to 55 events in 15 sports. Stanisława Walasiewicz won silver in the women's 100 metres and Jadwiga Wajs silver in the women's discus throw.\n\nIn all the team won no gold medal, three silver and three bronze, and ranked 22nd."
 ep_pol.3.a:0 "Honour every medallist and every competitor."
 ep_pol.3.b:0 "Gold will come. Fund the clubs for the next Games."
 ep_pol.4.t:0 "Three Men Complete the First Traverse of Spitsbergen"
 ep_pol.4.desc:0 "Stanisław Siedlecki, Stefan Bernadzikiewicz and Konstanty Narkiewicz-Jodko made the first traverse of Spitsbergen, from 7 July to 1 September. They crossed about 850 km. The expedition relied on its own resources, without any communication or support.\n\nShould the government receive the three men with honours, or leave that to others?"
 ep_pol.4.a:0 "Receive them in Warsaw with honours."
 ep_pol.4.b:0 "Let the mountaineering clubs celebrate their own."
 ep_pol.5.t:0 "France Promises Poland a Loan of Two Billion Francs"
 ep_pol.5.desc:0 "On 5 September Delbos gave a lunch for Rydz-Śmigły at the Quai d'Orsay.\n\nThe Rambouillet agreement commits France to a loan of two billion francs to Poland for its armament. Should the army spend it at once, or should we take care not to depend on Paris?"
 ep_pol.5.a:0 "Order the guns and aircraft the army lacks."
 ep_pol.5.b:0 "Take care to stay independent of Paris."
 ep_pol.6.t:0 "The PZL.37 Łoś Bomber Flies for the First Time"
 ep_pol.6.desc:0 "The order was for a modern, fast bomber to replace the outdated Fokker F.VII machines. Engineer Jerzy Dąbrowski prepared the plans, assisted by Piotr Kubicki and Franciszek Misztal.\n\nThe prototype of the PZL.37 Łoś made its first flight on 13 December. The pilot, Jerzy Widawski, reported several shortcomings. Should the bomber go into production at once?"
 ep_pol.6.a:0 "Fix the shortcomings before it reaches the squadrons."
 ep_pol.6.b:0 "Put it into production now."
 ep_pol.7.t:0 "Gdynia Grows to 102,000 Inhabitants"
 ep_pol.7.desc:0 "In May 1936 the city of Gdynia counted 83,000 inhabitants. In December it counted 102,000. The growth comes from workers who arrived from almost the whole country.\n\nAbout 30 percent of the people live in some 2,500 primitive huts and shacks. How should the city be built?"
 ep_pol.7.a:0 "Build streets and houses for the new workers."
 ep_pol.7.b:0 "Housing can wait. The quays cannot."
 ep_pol.8.t:0 "Yakov Zak Wins the Third Chopin Competition"
 ep_pol.8.desc:0 "The third Chopin Competition ran in Warsaw from 21 February to 13 March. Eighty pianists from 22 countries took part. Adam Wieniawski chaired the jury. The Soviet pianist Yakov Zak was awarded the first prize.\n\nChieko Hara of Japan, acclaimed by critics and the public, reached the final but was awarded only an honourable mention, and a commotion broke out. Fearing that the crowd would damage the Philharmonic, the industrialist Stanisław Meyer sponsored a special audience award for her."
 ep_pol.8.a:0 "The jury has spoken. Congratulate the winner."
 ep_pol.8.b:0 "Found a prize for Polish music beside the competition."
 ep_pol.9.t:0 "Karol Szymanowski Is Buried at Skałka"
 ep_pol.9.desc:0 "Karol Szymanowski died on 29 March in a sanatorium at Lausanne. His body travelled by train, and the train stopped for commemorative ceremonies in Berlin, at the German-Polish border and in Poznań.\n\nThe Warsaw funeral took place on the morning of Tuesday 6 April in the Church of the Holy Cross. On Wednesday 7 April the coffin arrived in Kraków and was carried past Wawel to the church on Skałka. He is buried in the Crypt of the Distinguished there."
 ep_pol.9.a:0 "Keep the Crypt of the Distinguished for such men."
 ep_pol.9.b:0 "Print his scores at the state's expense."
 ep_pol.10.t:0 "Archbishop Sapieha Moves Piłsudski's Coffin"
 ep_pol.10.desc:0 "Archbishop Adam Sapieha ordered, against the state authorities, that Marshal Piłsudski's coffin be moved to the prepared crypt under the Silver Bells Tower on 22 June.\n\nThe Marshal's memorial committee and President Mościcki opposed the archbishop's decision. Because of the Wawel conflict, Prime Minister Składkowski demonstratively handed in the resignation of his government. The President did not accept it."
 ep_pol.10.a:0 "Stand with the committee and the President."
 ep_pol.10.b:0 "Settle it quietly with the archbishop."
 ep_pol.11.t:0 "11 November Is Celebrated as a State Holiday"
 ep_pol.11.desc:0 "The law of 23 April gave Independence Day on 11 November the rank of a state holiday. It is meant to link the regaining of state sovereignty with the end of the First World War and to commemorate Józef Piłsudski.\n\nUntil this year the celebrations in Warsaw were military ceremonies, usually held on the first Sunday after 11 November. This year they included the unveiling of a monument to General Józef Sowiński."
 ep_pol.11.a:0 "A parade of the army through Warsaw."
 ep_pol.11.b:0 "A holiday for every town and village."
 ep_pol.12.t:0 "ORP Błyskawica Enters Service in the Polish Navy"
 ep_pol.12.desc:0 "ORP Błyskawica entered service in the Polish Navy on 25 November. Her first commander is Tadeusz Podjazd-Morgenstern. She carries seven 120 mm guns and has a maximum speed of 39.6 knots.\n\nGrom was ordered from the British J. Samuel White shipyard in Cowes and was commissioned in 1937. The Grom class was designed both for shore defence and for convoy escort."
 ep_pol.12.a:0 "Base both at Gdynia to guard the coast."
 ep_pol.12.b:0 "Train the crews at sea before anything else."
 ep_pol.13.t:0 "Poland Loses 6-5 to Brazil at the World Cup"
 ep_pol.13.desc:0 "On 5 June, at the Stade de la Meinau in Strasbourg, Brazil beat Poland 6-5. It was Poland's first ever World Cup match. The attendance was 13,452.\n\nWilimowski scored four times, in the 53rd, 59th, 89th and 118th minutes. No player before him has scored four goals in a single World Cup match."
 ep_pol.13.a:0 "They gave the Brazilians a fight. Well played."
 ep_pol.13.b:0 "Five goals and still beaten. The defence must improve."
 ep_pol.14.t:0 "Janusz and Janik Win the Gordon Bennett Cup"
 ep_pol.14.desc:0 "Antoni Janusz and Franciszek Janik have won the Gordon Bennett Cup for 1938 in the balloon SP-BCU LOPP. The race started at Liège on 11 September, and they covered 1,692 km in 37 hours and 47 minutes.\n\nJanusz is an officer of the Polish Air Force. The cup was held in Warsaw in 1934, 1935 and 1936."
 ep_pol.14.a:0 "Praise the airmen who flew it."
 ep_pol.14.b:0 "Fund the balloon crews for next year's race."
 ep_pol.15.t:0 "Polish Jews Expelled from Germany Are Sent to Zbąszyń"
 ep_pol.15.desc:0 "In October about 17,000 Polish Jews living in Germany were arrested and expelled. Polish citizenship can be revoked if the citizen has lived abroad for more than five years. Polish citizens living outside Poland had to obtain an endorsement stamp on their passports before 30 October.\n\nOf the expelled, 8,000 were sent to the town of Zbąszyń, where they sleep in poorly constructed barracks with very few provisions. The Polish Government quickly closed the border and denied any further access."
 ep_pol.15.a:0 "Admit them and organise relief at Zbąszyń."
 ep_pol.15.b:0 "Keep the border shut until Berlin negotiates."
 ep_pol.16.t:0 "Polish and Hungarian Soldiers Meet at the Border"
 ep_pol.16.desc:0 "Hungarian patrols have reached the Werecka Pass, also called the Tucholska Pass, on what was the border of Poland with Czecho-Slovakia. There, in the Carpathians, Polish troops welcomed the Hungarians coming from the south. An official delegation led by General Mieczysław Boruta-Spiechowicz awaited them.\n\nRegent Horthy telegraphed his greetings to President Mościcki 'at the historic moment when a Hungarian soldier shakes the right hand of a Polish soldier on the Polish-Hungarian border'. A demonstration was held outside the Hungarian legation in Koszykowa street. The new border is only 180 km long."
 ep_pol.16.a:0 "A common border with Hungary is a gain."
 ep_pol.16.b:0 "Keep the celebrations quiet. Berlin is watching."
 ep_pol.17.t:0 "Nanda Devi East Climbed, Two Climbers Lost"
 ep_pol.17.desc:0 "The Polish Himalayan expedition was led by Adam Karpiński. Its members were Jakub Bujak, Stefan Bernadzikiewicz, Janusz Klarner and Major J. R. Foy. On 2 July Bujak and Klarner reached the 7434 m summit of Nanda Devi East.\n\nOn 18 July an avalanche came down on Camp III and buried Bernadzikiewicz and Karpiński. The party started early on 19 July and reached the edge of the hanging glacier by noon. They saw only a huge avalanche covering the site."
 ep_pol.17.a:0 "Honour the two who died and the two who stood on top."
 ep_pol.17.b:0 "Fund the next Polish expedition to the Himalaya."
 ep_pol.18.t:0 "The National Defence Fund Gathers Gifts"
 ep_pol.18.desc:0 "The National Defence Fund was created by a decree of the President. Its purpose is to obtain extra money for the rearmament of the army and for a military investment programme. The Ministry of National Defence manages it.\n\nSchoolchildren give their pocket money, and people give jewellery, precious coins and gold earrings. Janusz Kusociński gave a gold signet ring of 9.5 grams and Janina Kurkowska-Spychajowa eight silver cups."
 ep_pol.18.a:0 "Put collection boxes in every shop and school."
 ep_pol.18.b:0 "Ask the firms and the councils to give first."
 ep_pol.19.t:0 "French and British Representatives Come to Pyry"
 ep_pol.19.desc:0 "French and British intelligence representatives have arrived in Warsaw. At seven in the morning they get into cars provided by the Polish staff. At Pyry, south of Warsaw, the Polish methods are revealed to them.\n\nMajor Maksymilian Ciężki gives a three-hour lecture on the history of the Polish struggle with the Enigma. Then the device is presented. Asked where they got it, Colonel Gwido Langer, head of the cipher bureau, answers: 'We made it ourselves.' Two copies are intended for the visitors, one for Paris and one for London."
 ep_pol.19.a:0 "Share everything with Paris and London."
 ep_pol.19.b:0 "Show them only what they need to see."
 ep_pol.20.t:0 "Schleswig-Holstein Opens Fire on Westerplatte"
 ep_pol.20.desc:0 "In the early morning Schleswig-Holstein fired a broadside at the Polish garrison at Westerplatte. Major Henryk Sucharski commands the garrison, and Captain Franciszek Dąbrowski is his second-in-command.\n\nStaff Sergeant Wojciech Najsarek was killed by machine-gun fire. What orders do we give the garrison?"
 ep_pol.20.a:0 "Hold to the last man."
 ep_pol.20.b:0 "Save the men if the position cannot be held."
 ep_pol_gdynia_housing:0 "Housing for Gdynia"
 ep_pol_gdynia_housing_desc:0 "Streets and houses are built for the workers who came to Gdynia."
 ep_pol_pyry_cooperation:0 "Cipher Cooperation"
 ep_pol_pyry_cooperation_desc:0 "French and British experts work on the Polish methods."
