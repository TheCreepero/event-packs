l_russian:
 ep_fra.1.t:0 "The Transindochinois Is Joined at Hao Son"
 ep_fra.1.desc:0 "On 2 September the two construction teams of the Transindochinois met at Hao Son, at kilometre 1221, and the last piece of rail was put in place. A monument there records the joining of the railway from the Chinese border with the railway of Saigon.\n\nOn 1 October the section from Hao Son to Dai Lanh opened to traffic, and Bao Dai presided over the burial of ceremonial parchments at the monument."
 ep_fra.1.a:0 "Run through trains as soon as we can."
 ep_fra.1.b:0 "Well done to both construction teams."
 ep_fra.2.t:0 "Viénot Signs a Treaty with Syria"
 ep_fra.2.desc:0 "Pierre Viénot and Hashim al-Atassi signed a Franco-Syrian treaty on 9 September. It provides for Syrian independence and unity: the autonomies of the Druze and the Alawites are to end. France keeps military facilities in Syria for 25 years.\n\nThe treaty goes next to the Syrian parliament and to our own."
 ep_fra.2.a:0 "Put it before the Chamber without delay."
 ep_fra.2.b:0 "The army keeps its bases. The Senate can take its time."
 ep_fra.3.t:0 "Interior Minister Salengro Takes His Own Life"
 ep_fra.3.desc:0 "Roger Salengro, Minister of the Interior in the Blum government, killed himself in Lille on 17 November. L'Action française and Gringoire, whose director is Henri Béraud, had accused him of deserting in the Great War, and Gringoire kept up the attacks.\n\nSalengro left a letter to Léon Blum and one to his brother. His funeral was held in Lille on 22 November."
 ep_fra.3.a:0 "Make the law on press libel harder."
 ep_fra.3.b:0 "The press stays free, even this press."
 ep_fra.4.t:0 "Mermoz and the Croix-du-Sud Lost at Sea"
 ep_fra.4.desc:0 "Jean Mermoz took off from Dakar for Natal on 7 December in the Latécoère 300 flying boat Croix-du-Sud. With him were Alexandre Pichodou, Henri Ezan, Edgar Cruveilher and Jean Lavidalie. Mermoz radioed that he had to cut the power on the aft starboard engine. No further message came.\n\nMermoz, 34, and his crew disappeared at sea 800 km south of Dakar. Neither the aircraft nor the crew has been found."
 ep_fra.4.a:0 "Keep flying from Dakar to Natal."
 ep_fra.4.b:0 "Ground the line until we know the cause."
 ep_fra.5.t:0 "President Lebrun Opens the Paris Exposition"
 ep_fra.5.desc:0 "President Albert Lebrun opened the Exposition internationale des Arts et Techniques on 24 May, later than the planned date of 1 May. The Palais de Chaillot, the Palais de Tokyo and the Palais de la Découverte were inaugurated right after.\n\nThe Palais de la Découverte is the project of the physicist Jean Perrin, Nobel laureate of 1926. It is installed in the west wing of the Grand Palais, the Palais d'Antin."
 ep_fra.5.a:0 "Let all Paris come to the fair."
 ep_fra.5.b:0 "Keep Perrin's halls open after the fair."
 ep_fra.6.t:0 "Italy Puts France Out of the World Cup"
 ep_fra.6.desc:0 "The World Cup in France began on 4 June. On 5 June France beat Belgium 3-1 at Colombes. On 12 June France met Italy in the quarter-final at Colombes, before more than 58,000 spectators.\n\nColaussi put Italy ahead in the 9th minute, and Heisserer equalised in the 10th. Piola scored in the 51st and the 72nd minutes. Italy won 3-1."
 ep_fra.6.a:0 "They did the country proud."
 ep_fra.6.b:0 "Next time we beat the Italians."
 ep_fra.7.t:0 "King George VI and Queen Elizabeth in Paris"
 ep_fra.7.desc:0 "King George VI and Queen Elizabeth arrived on 19 July for a state visit. They called on the President of the Republic, received the diplomatic corps, dined at the Élysée and saw Sacha Guitry and Ninon Vallin perform.\n\nOn 20 July they were received at the Hôtel de Ville, returned to the Quai d'Orsay by the Seine and attended a gala at the Opéra. On 21 July at Versailles, 50,000 men paraded before the King, with an air display. Lunch followed in the Hall of Mirrors. The King and Queen left from the Gare des Invalides on 22 July."
 ep_fra.7.a:0 "London has never been a closer friend."
 ep_fra.7.b:0 "A fine visit. Now back to the budget."
 ep_fra.8.t:0 "Fire at the Nouvelles Galeries Kills 73 in Marseille"
 ep_fra.8.desc:0 "Fire broke out in the early afternoon of 28 October at the Nouvelles Galeries department store on the Canebière in Marseille. It killed 73 people.\n\nAt the request of Rear Admiral Muselier, who commands the Navy at Marseille, the marins-pompiers of Toulon were sent as reinforcements. They arrived only from 5 pm, when the store was already lost."
 ep_fra.8.a:0 "Give Marseille a fire battalion of naval men."
 ep_fra.8.b:0 "The city must answer for its own firemen."
 ep_fra.9.t:0 "The Battleship Richelieu Is Launched at Brest"
 ep_fra.9.desc:0 "The battleship Richelieu, built by the Brest arsenal, was launched on 17 January. Her keel was laid on 22 October 1935 in the No. 4 dock at Brest, which had recently built the Dunkerque.\n\nThe Dunkerque was launched on 2 October 1935 and commissioned on 31 December 1936. The Dunkerque's sister Strasbourg was launched on 12 December 1936."
 ep_fra.9.a:0 "Press on with the fitting-out."
 ep_fra.9.b:0 "The yards will take the time they need."
 ep_fra.10.t:0 "The Submarine Phénix Is Lost off Cam Ranh"
 ep_fra.10.desc:0 "The submarine Phénix went down on 15 June in the South China Sea off Cam Ranh. She was on training manoeuvres with the light cruiser Lamotte-Picquet and aircraft. The exercise included a mock attack on the cruiser. The toll is 71 dead: 5 officers and 66 ratings.\n\nThe Phénix had been commissioned on 21 October 1932."
 ep_fra.10.a:0 "Open an inquiry into the exercise."
 ep_fra.10.b:0 "The manoeuvres go on."
 ep_fra.11.t:0 "British Guards March in the 14 July Parade"
 ep_fra.11.desc:0 "This 14 July marked the 150th anniversary of the taking of the Bastille. More than 30,000 soldiers took part in the parade, and detachments of the British Brigade of Guards and of the Royal Marines marched in it. Senegalese tirailleurs of the 24th regiment marched on the Champs-Élysées.\n\nGamelin went to London to settle military cooperation between the two countries. He met his counterpart, Gort, on 9 June."
 ep_fra.11.a:0 "Let Berlin take note."
 ep_fra.11.b:0 "Let Paris enjoy its holiday."
 ep_fra.12.t:0 "A Family Code Rewards the First Child"
 ep_fra.12.desc:0 "A decree-law of 29 July sets out a Code de la famille. A couple whose first child is born within two years of the wedding will receive a birth bonus. Single people will pay a family compensation tax. The penalties for abortion are made heavier.\n\nA separate decree-law of the same day limits the profits of firms working for national defence. The census of 8 March 1936 counted 41,911,530 inhabitants."
 ep_fra.12.a:0 "Pay the bonus promptly in every commune."
 ep_fra.12.b:0 "The decree can speak for itself."
 ep_fra.13.t:0 "The Louvre Sends Its Collections to Chambord"
 ep_fra.13.desc:0 "Jacques Jaujard, director of the national museums, has organised the evacuation of the Louvre. On 25 August the museum was closed for three days, officially for repairs. The Joconde left the Louvre on 28 August.\n\nThe evacuation sends much of the collection to the Château de Chambord: 203 vehicles and 1,862 wooden cases in all."
 ep_fra.13.a:0 "Empty the galleries. The paintings can wait for peace."
 ep_fra.13.b:0 "Leave a few masterpieces on show for Parisians."
 ep_fra.14.t:0 "The First Cannes Film Festival Is Called Off"
 ep_fra.14.desc:0 "The festival at Cannes was to run from 1 to 20 September, with Louis Lumière as president and the Coupe Lumière as its prize. Jean Zay approved it last December as an answer to the Venice Mostra. MGM chartered a liner to bring Hollywood stars, and The Wizard of Oz and Goodbye Mr. Chips were in the selection.\n\nThe festival has been cancelled after the invasion of Poland."
 ep_fra.14.a:0 "Postpone it to a quieter year."
 ep_fra.14.b:0 "Hold a few screenings for the town anyway."
 ep_fra.15.t:0 "Civilians Evacuated from Alsace and Moselle"
 ep_fra.15.desc:0 "General mobilisation was ordered on 1 September. On 2 and 3 September at least 530,000 Alsatians and Lorrainers, civilians of the Bas-Rhin, the Haut-Rhin and the Moselle, were evacuated to the departments of the south-west.\n\nOn 18 October the Protestant youth movements founded the Cimade, the Comité inter-mouvements auprès des évacués. It sends teams to the south-west."
 ep_fra.15.a:0 "Lodge them at the state's expense."
 ep_fra.15.b:0 "Every village in the south-west will do its share."
 ep_fra.16.t:0 "The Army Is Ordered Back Behind the Maginot Line"
 ep_fra.16.desc:0 "Our units moved off in the night of 5 to 6 September. On 8 September the 42nd Infantry Division took the Warndt forest, and on 9 September four R35 tanks of the 20th BCC hit mines north of Bliesbrück. By 12 September the army held a strip of ground 25 km long and 5 to 8 km deep.\n\nOn 12 September General Gamelin stopped the offensive so as not to cut the army off from its rear bases. The Siegfried Line was not attacked. On 30 September General Georges decided to pull the units of the 3rd, 4th and 5th Armies back behind the Maginot Line by 4 October."
 ep_fra.16.a:0 "Behind the Maginot Line we can wait."
 ep_fra.16.b:0 "We took the Warndt once. We will again."
 ep_fra.17.t:0 "The Polish Government Settles at Angers"
 ep_fra.17.desc:0 "The Franco-Polish military agreement of 9 September created the Polish Army in France. The camp at Coëtquidan was placed at its disposal on 12 September, and Parthenay is its other main centre.\n\nWładysław Sikorski, also minister of military affairs, became commander-in-chief on 7 November. The Polish prime minister and his government settled at Angers from 22 November. President Raczkiewicz lives at the Château de Pignerolle, near Angers."
 ep_fra.17.a:0 "Arm them from our own stocks."
 ep_fra.17.b:0 "Train them first. Arms come later."
 ep_fra.18.t:0 "The Communist Party Is Banned"
 ep_fra.18.desc:0 "The French Communist Party was banned on 26 September. L'Humanité had been seized on 26 August, three days after the German-Soviet pact, and censorship followed the next day. Of the party's 72 deputies, 21 resigned from it after the pact.\n\nIn the night of 3 to 4 October the sapper Maurice Thorez left his unit without leave. Between 6 and 8 October, 34 deputies of the Groupe ouvrier et paysan français were arrested."
 ep_fra.18.a:0 "Let the courts deal with the deputies."
 ep_fra.18.b:0 "Welcome back those who broke with Moscow."
 ep_fra.19.t:0 "King George VI Visits the Armies in France"
 ep_fra.19.desc:0 "British troops began landing at Boulogne on 12 September. In December King George VI crossed to Boulogne himself aboard the destroyer HMS Codrington, and Lord Gort met him.\n\nOn 9 December, with General Gamelin and Lord Gort, the King inspected French and British troops in the Saar sector of the front."
 ep_fra.19.a:0 "Our two armies stand together."
 ep_fra.19.b:0 "Good. Now send the men home on leave."
 ep_fra.20.t:0 "Norway's Heavy Water Reaches the Collège de France"
 ep_fra.20.desc:0 "Raoul Dautry entrusted Jacques Allier with secretly buying the available stock of Norsk Hydro's heavy water: 185 kg, from the Vemork plant. At the end of March the stock was flown to France by way of Scotland. Allier came back with 26 canisters of seven litres.\n\nThe heavy water went into the cellars of the Collège de France. Joliot-Curie and Kowarski need it in large quantity as a moderator, to slow the neutrons in their experiment."
 ep_fra.20.a:0 "Give Joliot-Curie's laboratory what it asks for."
 ep_fra.20.b:0 "Keep the canisters under guard and say nothing."
 ep_fra_transindochinois_traffic:0 "The Transindochinois"
 ep_fra_transindochinois_traffic_desc:0 "The railway from the Chinese border is joined to the railway of Saigon."
 ep_fra_palais_de_la_decouverte:0 "Palais de la Découverte"
 ep_fra_palais_de_la_decouverte_desc:0 "Jean Perrin's science halls in the Grand Palais stay open to the public."
 ep_fra_family_code:0 "Code de la famille"
 ep_fra_family_code_desc:0 "A birth bonus for a first child born within two years of the wedding, and a family compensation tax on single people."
 ep_fra_evacuee_relief:0 "Evacuees from Alsace and Moselle"
 ep_fra_evacuee_relief_desc:0 "The departments of the south-west lodge the evacuees at the state's expense."
 ep_fra_joliot_curie_laboratory:0 "Joliot-Curie's Laboratory"
 ep_fra_joliot_curie_laboratory_desc:0 "The heavy water from Vemork goes to the experiment of Joliot-Curie and Kowarski."
