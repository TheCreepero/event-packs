l_german:
 ep_fin.1.t:0 "Three Finns Take the 10,000 Metres in Berlin"
 ep_fin.1.desc:0 "In the 10,000 m final at the Berlin Olympics on 2 August, Ilmari Salminen won gold, Arvo Askola silver and Volmari Iso-Hollo bronze.\n\nIso-Hollo also won the 3,000 m steeplechase, for the second Games in a row. In the javelin, Yrjö Nikkanen and Kalervo Toivonen took silver and bronze behind Stöck of Germany."
 ep_fin.1.a:0 "Meet the team when they come home."
 ep_fin.1.b:0 "Let the sports clubs do the celebrating."
 ep_fin.2.t:0 "Cajander Forms a Red-Earth Government"
 ep_fin.2.desc:0 "Kyösti Kallio has been president since 1 March. After his election, Aimo Cajander, chairman of the National Progressive Party, was asked to form a majority government. The cabinet formed on 12 March joins the Progressives, the Social Democrats, the Agrarian League and the Swedish People's Party. The first three are called punamulta, red-earth.\n\nVäinö Tanner of the Social Democrats takes the finance ministry. In the years of right-wing unrest, Kallio and Tanner worked closely together for parliamentary government and democracy."
 ep_fin.2.a:0 "Give every partner a say, however slow."
 ep_fin.2.b:0 "Let the finance ministry set the pace."
 ep_fin.3.t:0 "Aalto's Timber Pavilion Stands at the Paris Exposition"
 ep_fin.3.desc:0 "The Paris exposition opened on 25 May, with 45 countries taking part. It runs until 25 November.\n\nFinland's pavilion is the work of Alvar Aalto, who won both first and second prize in last year's open competition. His winning entry, 'Le bois est en marche', formed the basis of the pavilion. It is built entirely of timber, an advertisement for Finland's prime export."
 ep_fin.3.a:0 "Send trade officials to Paris with the pavilion."
 ep_fin.3.b:0 "Good timber sells itself."
 ep_fin.4.t:0 "The First Vickers Tanks Arrive Without Guns"
 ep_fin.4.desc:0 "The first Vickers-Armstrongs 6-ton tanks have arrived. The Ministry of Defence ordered 32 on 20 July 1936, to form a battalion of two 15-tank companies and a 2-tank headquarters element. Eleven were due by 20 July 1937.\n\nTo save money, the tanks were ordered without optics, radios or armament, at 4,500 pounds each. They now go to the State Artillery Factory, Valtion Tykkitehdas, to be equipped with guns."
 ep_fin.4.a:0 "Arm them now, whatever the factory needs."
 ep_fin.4.b:0 "They can wait; the money goes elsewhere."
 ep_fin.5.t:0 "Maternity Grant Law Adopted"
 ep_fin.5.desc:0 "A law adopted on 24 September gives mothers of low income a maternity grant from 1 January 1938. The grant is worth 450 markkaa per child, paid as cash or in kind.\n\nThe law answers concern over the falling birth rate and high child mortality."
 ep_fin.5.a:0 "Fund it in full, for every mother."
 ep_fin.5.b:0 "Keep it for low-income mothers, as written."
 ep_fin.6.t:0 "1937 Was a Record Year"
 ep_fin.6.desc:0 "1937 was a record year in many branches of the economy, with sharply rising prices, brisk industrial investment and a good harvest. Industrial activity reached record levels. Sulphate pulp exports rose from 323,200 to 355,700 tonnes, and sulphite pulp from 757,600 to 823,600 tonnes.\n\nExports grew first of all on good timber prices and larger sales of plywood and paper abroad. By preliminary figures the export surplus was 90.9 million marks, against 853.6 million in 1936."
 ep_fin.6.a:0 "Put the profits into new mills and plants."
 ep_fin.6.b:0 "Save it against the next bad year."
 ep_fin.7.t:0 "A Soviet Diplomat Opens Secret Talks"
 ep_fin.7.desc:0 "Boris Yartsev, a second-class secretary at the Soviet embassy, has opened secret talks with the government on Moscow's behalf. Moscow offers all possible economic and military help if Finland fights a German invasion. In return it wants Finland to cede or lease some islands near Leningrad, and it would permit Finland to fortify Åland.\n\nForeign Minister Rudolf Holsti is away, and members of the Cajander government are hearing the offer. How should we answer?"
 ep_fin.7.a:0 "Keep listening, and promise nothing."
 ep_fin.7.b:0 "No Finnish island is for lease."
 ep_fin.8.t:0 "Helsinki Is Given the 1940 Olympic Games"
 ep_fin.8.desc:0 "Tokyo won the 1940 Games over Helsinki by 36 votes to 27 at Berlin in 1936, but on 16 July it withdrew as host. On 3 September the IOC Executive Board, meeting in Brussels, officially awarded the Games to Helsinki.\n\nThe Helsinki Olympic Stadium, designed by Yrjö Lindegren and Toivo Jäntti, opened on 12 June, still unfinished. Its tower stands 72.71 m, the length of Matti Järvinen's winning javelin throw at the 1932 Games. The stadium is to be completed for 1940."
 ep_fin.8.a:0 "Accept, and finish the stadium properly."
 ep_fin.8.b:0 "Accept, on a strict budget."
 ep_fin.9.t:0 "Foreign Minister Holsti Resigns"
 ep_fin.9.desc:0 "Rudolf Holsti has resigned as foreign minister. On 7 November our envoy Aarne Vuorimaa reported accusations against him made by State Secretary Ernst von Weizsäcker. The cabinet feared German retaliation and wanted Holsti to step down.\n\nVäinö Voionmaa of the Social Democrats is acting foreign minister."
 ep_fin.9.a:0 "Name a minister Berlin cannot object to."
 ep_fin.9.b:0 "We choose our ministers, not Berlin."
 ep_fin.10.t:0 "Social Democrats Win 85 Seats"
 ep_fin.10.desc:0 "The votes of the 1 and 2 July election are counted. The Social Democrats hold 85 seats with 39.77 per cent of the vote, and the Agrarian League 56. The National Coalition has 25, the Swedish People's Party 18, IKL 8 and the National Progressive Party 6. IKL drew 86,219 votes.\n\nTurnout was 66.55 per cent: 1,302,348 of 1,956,807 registered voters. The Cajander government stays in office."
 ep_fin.10.a:0 "Carry on as before."
 ep_fin.10.b:0 "Spend on welfare while the mandate is fresh."
 ep_fin.11.t:0 "Taisto Mäki Runs 10,000 Metres Under 30 Minutes"
 ep_fin.11.desc:0 "At the Olympic Stadium in Helsinki on 17 September, Taisto Mäki ran 10,000 metres in 29:52.6, breaking his own world record. No man has run the distance in under 30 minutes before.\n\nHe first broke the record in Tampere on 29 September 1938, running 30:02.0 and beating Ilmari Salminen's old mark by more than three seconds."
 ep_fin.11.a:0 "Put it on every front page."
 ep_fin.11.b:0 "A fine run, but the cabinet has other business."
 ep_fin.12.t:0 "Sillanpää Awarded the Nobel Prize in Literature"
 ep_fin.12.desc:0 "On 10 November the Swedish Academy decided to award Frans Eemil Sillanpää the Nobel Prize in Literature for 1939, for his 'deep understanding of his country's peasantry'. He is the first Finn to win it.\n\nHis novels include Hurskas kurjuus of 1919 and Nuorena nukkunut of 1931. During the 1930s Nuorena nukkunut was translated into seventeen languages, and Miehen tie and Ihmiset suviyössä into eight."
 ep_fin.12.a:0 "Honour him with a state reception."
 ep_fin.12.b:0 "A telegram of congratulations will do."
 ep_fin.13.t:0 "The League of Nations Expels the Soviet Union"
 ep_fin.13.desc:0 "The League Assembly has heard Finland's delegate and set up a Special Committee to study our appeal. The delegate of Argentina demanded the expulsion of the Soviet Union.\n\nThe Council of the League of Nations finds that the Union of Soviet Socialist Republics 'has placed itself outside the League of Nations.' It is no longer a member."
 ep_fin.13.a:0 "Now ask the members for arms."
 ep_fin.13.b:0 "Thank the League, and look for help elsewhere."
 ep_fin.14.t:0 "Detachment P Defeats the Enemy at Tolvajärvi"
 ep_fin.14.desc:0 "Lieutenant Colonel Aaro Pajari reported to Paavo Talvela at 5 pm: 'Today, I have attacked and defeated the enemy in Tolvajärvi, and the enemy has retreated with heavy losses to the east.' His Detachment P is part of Group T. The Soviet 139th Rifle Division began a disorderly retreat after the Finnish forces launched their offensive. It is the first major Finnish victory of the war.\n\nAbout 100 Finns were killed in the day's attack. The Soviet dead in the battle are put at ten times as many, and 20 tanks and 60 machine guns were captured. Talvela is promoted to major general and Pajari to colonel."
 ep_fin.14.a:0 "Keep pressing east."
 ep_fin.14.b:0 "Hold the line and rest the men."
 ep_fin.15.t:0 "Hoover's Relief Fund Raises 2.5 Million Dollars"
 ep_fin.15.desc:0 "Former U.S. President Herbert Hoover started the Finnish Relief Fund. He appeared at Madison Square Garden with Hendrik Willem van Loon and Fiorello La Guardia. The fund advertises in 1,400 American newspapers.\n\nSo far the fund has raised 2.5 million dollars."
 ep_fin.15.a:0 "Thank Mr Hoover, and ask for nothing more."
 ep_fin.15.b:0 "Ask Washington for arms credits as well."
 ep_fin_maternity_grant:0 "Maternity Grant"
 ep_fin_maternity_grant_desc:0 "Mothers may take the grant of 450 markkaa per child as cash or in kind."
 ep_fin_industrial_reinvestment:0 "Reinvested Export Profits"
 ep_fin_industrial_reinvestment_desc:0 "The profits of the record year go into new mills and plants."
 ep_fin_paris_trade_mission:0 "Paris Trade Mission"
 ep_fin_paris_trade_mission_desc:0 "Trade officials follow the timber pavilion to Paris to sell Finnish wood."
