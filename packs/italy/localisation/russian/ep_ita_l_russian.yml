l_russian:
 ep_ita.1.t:0 "Empire Proclaimed from Palazzo Venezia"
 ep_ita.1.desc:0 "'Ethiopia is Italian! Italian in fact, because it is occupied by our victorious armies,' Mussolini said. From the balcony of Palazzo Venezia he proclaimed the formation of the Italian Empire, and King Victor Emmanuel III assumed the additional title of Emperor of Ethiopia.\n\nA decree unified the three territories of Ethiopia, Eritrea and Somalia into a single legal and political entity, Italian East Africa. The colony was divided into six governorates."
 ep_ita.1.a:0 "Celebrate it in every town."
 ep_ita.1.b:0 "Name the governors without delay."
 ep_ita.2.t:0 "Fiat Launches the Topolino"
 ep_ita.2.desc:0 "The Fiat 500, known as the Topolino, debuted in June. It has a 569 cc engine with 13 horsepower and a top speed of 85 km/h. Fiat's brief called for a car able to carry four passengers. The target price was 5,000 lire. The simplest version costs 8,900 lire.\n\nWho can afford one?"
 ep_ita.2.a:0 "A car for the Italian family."
 ep_ita.2.b:0 "Motoring is for those who can pay."
 ep_ita.3.t:0 "Ciano Takes the Foreign Ministry"
 ep_ita.3.desc:0 "Galeazzo Ciano, aged 33, has been named Italy's minister of foreign affairs. Born on 18 March 1903, he was minister of press and propaganda in the government of his father-in-law.\n\nHe volunteered for action in the invasion of Ethiopia as a bomber squadron commander."
 ep_ita.3.a:0 "Ciano will speak for the Duce."
 ep_ita.3.b:0 "Leave the old ambassadors where they are."
 ep_ita.4.t:0 "Rome Orders Twelve SM.81 Bombers Sent"
 ep_ita.4.desc:0 "Rome ordered twelve three-engined Savoia-Marchetti SM.81 bombers sent. The first unit set out at dawn from Cagliari-Elmas on Sardinia. All Italian insignia on the planes had been blotted out. On paper the aircraft were being sold to the Spanish journalist Luis Bolín.\n\nNot all of the Italian planes sent to aid the rebel faction reached Morocco. How should we respond?"
 ep_ita.4.a:0 "The planes were sold. We have nothing to add."
 ep_ita.4.b:0 "Prepare more aircraft for the same route."
 ep_ita.5.t:0 "Italy Wins Olympic Football Gold"
 ep_ita.5.desc:0 "In the Olympiastadion in Berlin, Italy overcomes Austria in the final of the Olympic football tournament. Midway through the second half Frossi scores first for the Azzurri, and he gets the winning goal just as extra time begins. Vittorio Pozzo is the coach.\n\nEarlier in the tournament Italy defeated Japan after Pozzo decided to include Biagi. How does Rome greet the team?"
 ep_ita.5.a:0 "Receive the team at Palazzo Venezia."
 ep_ita.5.b:0 "Let the football federation thank them."
 ep_ita.6.t:0 "Lira Devalued by About 41 Per Cent"
 ep_ita.6.desc:0 "The government devalues the lira by about 41 per cent. The dollar rate goes from 11.22 to 19 lire. In September the United States, Great Britain and France signed the Tripartite Agreement.\n\nIndustrialists have accumulated large stocks of raw materials. The revaluation of the gold reserve brings the Bank of Italy and the Treasury a not inconsiderable bonus."
 ep_ita.6.a:0 "Reassure the savers."
 ep_ita.6.b:0 "The gold bonus goes to the Treasury."
 ep_ita.7.t:0 "Italy and Germany Conclude a Protocol"
 ep_ita.7.desc:0 "Ciano met von Neurath on 21 October. On 23 October Italy and Germany concluded a protocol. Its terms are not made public.\n\nThe protocol states: 'Communism is the greatest danger threatening the peace and the security of Europe.' Italy undertakes to support the restoration of Germany's colonies. Mussolini said: 'this vertical axis Berlin-Rome is not a diaphragm, but rather an axis.'"
 ep_ita.7.a:0 "Say nothing of the terms."
 ep_ita.7.b:0 "Let Berlin know what Italy expects in return."
 ep_ita.8.t:0 "Fog and Sleet Slow the Advance at Guadalajara"
 ep_ita.8.desc:0 "At Guadalajara the advance of the Italian forces, 26,000 soldiers under General Roatta, was slowed by fog and sleet. The dirt airfields were flooded with mud.\n\nItalian anti-fascist volunteers had formed the Garibaldi Battalion. How do we answer the delay?"
 ep_ita.8.a:0 "Press on with the advance."
 ep_ita.8.b:0 "Hold the column until the weather clears."
 ep_ita.9.t:0 "Luigi Pirandello Dies in Rome"
 ep_ita.9.desc:0 "Luigi Pirandello, the playwright, has died in Rome of pneumonia at 69. A member of the Italian Academy, he died alone in his home at Via Bosio. In 1934 he was awarded the Nobel Prize for Literature, and he later gave the medal to the Fascist government to be melted down.\n\nHe was finishing a volume to be called Memories of My Involuntary Sojourn on Earth. How does the government mark the death of a Nobel laureate?"
 ep_ita.9.a:0 "Send a government wreath to Via Bosio."
 ep_ita.9.b:0 "Leave the arrangements to his family."
 ep_ita.10.t:0 "Cinecittà Opens With Mussolini"
 ep_ita.10.desc:0 "Mussolini and Giacomo Paulucci di Calboli inaugurate Cinecittà. In 1935 a vast fire destroyed the studios of the Cines company. The new complex, designed by the architect Gino Peressutti, has 73 buildings and covers 400,000 square metres.\n\nWho will be first on the new stages?"
 ep_ita.10.a:0 "Open the stages to every producer."
 ep_ita.10.b:0 "Reserve the best stages for state films."
 ep_ita.11.t:0 "Britain and Italy Conclude the Easter Accords"
 ep_ita.11.desc:0 "Britain and Italy have concluded the Easter Accords. The two governments undertake to observe the order in the Mediterranean and to uphold the freedom of navigation in the Suez Canal.\n\nEthiopia is not named in the agreements. How does Rome present them?"
 ep_ita.11.a:0 "A sound basis for the Mediterranean."
 ep_ita.11.b:0 "Ethiopia is not named, and that is enough for us."
 ep_ita.12.t:0 "Hitler Leaves Italy at the Brenner"
 ep_ita.12.desc:0 "Hitler's train left Florence after midnight and reached the Brenner on the morning of 9 May. His visit had taken him to Rome, Naples and Florence.\n\nMussolini waited for him at the Ostiense station, built for the occasion and not yet finished. A display was given by 50,000 balilla and avanguardisti. The best of the Regia Marina took part in a naval parade, and on the evening of 5 May Hitler watched Aida at the Teatro San Carlo with the King."
 ep_ita.12.a:0 "A fine display of friendship."
 ep_ita.12.b:0 "The guests have gone. Back to work."
 ep_ita.13.t:0 "Italy Keeps the World Cup"
 ep_ita.13.desc:0 "At the Stade Olympique de Colombes, in front of 45,000 spectators, Italy defended its title. After six minutes Gino Colaussi opened the scoring, and Pál Titkos equalised for Hungary two minutes later. Piola scored his second goal to complete a 4-2 win.\n\nThe referee was Georges Capdeville of France. How does Rome receive the champions?"
 ep_ita.13.a:0 "Receive the team in Rome."
 ep_ita.13.b:0 "Let the football speak for itself."
 ep_ita.14.t:0 "Bartali Wins the Tour de France"
 ep_ita.14.desc:0 "Gino Bartali wins the Tour de France, which ran from 5 to 31 July over 4,694 km, and also takes the mountains classification. He had been close to winning in 1937 until he crashed. This year he was asked to skip the Giro d'Italia.\n\nWhat will Rome make of an Italian winner in France?"
 ep_ita.14.a:0 "Send a telegram of congratulation."
 ep_ita.14.b:0 "Remind the papers that he rode for Italy."
 ep_ita.15.t:0 "Albania Offers Its Crown to the King"
 ep_ita.15.desc:0 "The Albanian parliament voted to depose Zog and to unite the nation with Italy. The Albanian crown was offered to Italy's King Victor Emmanuel III.\n\nZog took refuge in exile in neighbouring Greece. How should we answer the offer of the crown?"
 ep_ita.15.a:0 "Accept the crown for the King."
 ep_ita.15.b:0 "The crown can wait; the army will garrison Albania."
 ep_ita.16.t:0 "Mussolini Inaugurates Mirafiori"
 ep_ita.16.desc:0 "On 15 May Mussolini inaugurated the Fiat plant at Mirafiori. Flanked by Giovanni Agnelli and Achille Starace, he spoke from a prepared platform to about 50,000 Fiat workers. The plant is to be built on an area of a million square metres and, by the programme, to employ over 22,000 workers in two shifts.\n\nThe Duce was received coldly, without great enthusiasm. How should the press report it?"
 ep_ita.16.a:0 "Print the speech and leave out the cold reception."
 ep_ita.16.b:0 "Ask Agnelli how the workers feel."
 ep_ita.17.t:0 "Coffee and Sugar Are Rationed"
 ep_ita.17.desc:0 "Coffee is on the market again from 1 February. It is rationed at 0.6 kilograms a year, already prepared. Sugar is also to be rationed, at 6 kilograms a year per head.\n\nThe import and sale of coffee were suspended in October. Coffee imports amounted in 1938 to 36,000 tons. How is the ration to be run?"
 ep_ita.17.a:0 "Explain the ration in the newspapers."
 ep_ita.17.b:0 "Let the grocers hand it out themselves."
 ep_ita.18.t:0 "Coppi Takes the Pink Jersey"
 ep_ita.18.desc:0 "Coppi, at his first Giro d'Italia, won the eleventh stage alone on 29 May, from Florence to Modena, and took the pink jersey. The race runs in twenty stages from 17 May to 9 June.\n\nBartali fell on the descent of the Passo della Scoffera during the second stage and dropped out of the classification. Whom will the papers back now?"
 ep_ita.18.a:0 "Let the papers cheer the new leader."
 ep_ita.18.b:0 "Wait for the end of the race."
 ep_ita.19.t:0 "Aosta Urges Haste on British Somaliland"
 ep_ita.19.desc:0 "In East Africa, about 24,000 Italian and colonial troops face 4,507 British and Commonwealth troops in British Somaliland.\n\nAosta and his deputy, General Guglielmo Nasi, have completed an appreciation of the likely opposition. Aosta urges haste, but Nasi refuses to rush because the road is deteriorating. Which of them do we back?"
 ep_ita.19.a:0 "Order the advance without delay."
 ep_ita.19.b:0 "Let Nasi take the time he needs."
 ep_ita.20.t:0 "British Aircraft Strike the Fleet at Taranto"
 ep_ita.20.desc:0 "Enemy aircraft attack the naval base of Taranto in the first hours of the night. The attack is launched from a British carrier. A torpedo hits one of our battleships and blows a large hole in her hull. Another battleship escapes undamaged.\n\nWhat are our orders?"
 ep_ita.20.a:0 "Issue a short communique."
 ep_ita.20.b:0 "Move the undamaged ships out of Taranto."
